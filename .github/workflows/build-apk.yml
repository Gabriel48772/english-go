name: Compilar APK Android (Instalador Móvil)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-apk:
    name: Compilar APK Ejecutable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Instalar dependencias web
        run: npm ci

      - name: Compilar aplicación web
        run: npm run build

      - name: Sincronizar proyecto Android nativo con Capacitor
        run: npx cap sync android

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Android con Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK para distribución
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk EnglishGo.apk

      - name: Subir APK como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: EnglishGo-APK
          path: EnglishGo.apk
          retention-days: 30

      - name: Publicar APK en GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: 'EnglishGo! v1.0.0 - Instalador APK para Móviles'
          body: |
            ## 🦉 EnglishGo! - Instalador Oficial para Teléfonos Android
            
            ¡La aplicación ya está lista para instalarse directamente como archivo ejecutable en tu teléfono móvil!
            
            ### 📱 ¿Cómo instalar en tu teléfono?
            1. Descarga el archivo **EnglishGo.apk** que aparece aquí abajo en tu teléfono.
            2. Toca el archivo descargado para instalarlo.
            3. Si tu teléfono te pide permiso para "Instalar aplicaciones de fuentes desconocidas", presiona **Permitir**.
            4. ¡Listo! Abre **EnglishGo** y disfruta aprendiendo inglés con voz, juegos y situaciones reales.
          files: EnglishGo.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
